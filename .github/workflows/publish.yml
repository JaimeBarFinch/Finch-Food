# Runs on every change to main.
# 1. Runs the build, which includes every allergen and menu check (tools/build_data.py).
# 2. Only if every check passes, publishes the app to GitHub Pages.
# If a check fails, nothing is published and the live app stays as it was.
# Needs: Settings > Pages > Source set to "GitHub Actions".
name: Check and publish the food app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run the allergen and menu checks, then build
        run: python3 tools/build_data.py build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
